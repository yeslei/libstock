<div class="field">
  <label class="field__label" [for]="inputId">{{ label }}</label>

  <div class="field__control" [class.field__control--invalid]="errorMessage !== null">
    <input
      class="field__input"
      [id]="inputId"
      [type]="visible() ? 'text' : 'password'"
      [formControl]="control"
      [attr.autocomplete]="autocomplete"
      [attr.aria-invalid]="errorMessage !== null"
      [attr.aria-describedby]="describedBy"
      spellcheck="false"
      (input)="onInput($event)"
    />

    <button
      class="field__toggle"
      type="button"
      [attr.aria-pressed]="visible()"
      [attr.aria-label]="visible() ? 'Ocultar senha' : 'Mostrar senha'"
      [attr.title]="visible() ? 'Ocultar senha' : 'Mostrar senha'"
      (click)="toggleVisibility()"
    >
      <span aria-hidden="true">{{ visible() ? 'Ocultar' : 'Mostrar' }}</span>
    </button>
  </div>

  @if (showRequirements) {
    <ul class="requirements" [id]="inputId + '-requirements'">
      @for (requirement of requirements(); track requirement.label) {
        <li class="requirements__item" [class.requirements__item--met]="requirement.met">
          <span class="requirements__mark" aria-hidden="true">{{ requirement.met ? '✓' : '•' }}</span>
          <span>{{ requirement.label }}</span>
          <span class="visually-hidden">{{ requirement.met ? ' (cumprido)' : ' (pendente)' }}</span>
        </li>
      }
    </ul>
  }

  @if (errorMessage) {
    <p class="field__error" [id]="inputId + '-error'" aria-live="polite">{{ errorMessage }}</p>
  }
</div>
