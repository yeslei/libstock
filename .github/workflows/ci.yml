name: CI

on:
  push:
    branches: [main, integracao]
  pull_request:
    branches: [main, integracao]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      candidate_artifact:
        type: string
        default: ''

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_artifact && github.sha || inputs.ref || github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        if: inputs.candidate_artifact != ''
        with:
          name: ${{ inputs.candidate_artifact }}
          path: ${{ runner.temp }}/release

      - name: Carrega candidato local validado
        if: inputs.candidate_artifact != ''
        working-directory: .
        env:
          CANDIDATE_SHA: ${{ inputs.ref }}
        run: |
          git fetch "$RUNNER_TEMP/release/candidate.bundle" refs/heads/release-candidate
          git checkout --detach "$CANDIDATE_SHA"

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instala dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compila os fontes
        run: python -m compileall -q app migrations

      - name: Valida a importacao da aplicacao
        run: python -c "from app.main import app; print(app.title, app.version)"

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_artifact && github.sha || inputs.ref || github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        if: inputs.candidate_artifact != ''
        with:
          name: ${{ inputs.candidate_artifact }}
          path: ${{ runner.temp }}/release

      - name: Carrega candidato local validado
        if: inputs.candidate_artifact != ''
        working-directory: .
        env:
          CANDIDATE_SHA: ${{ inputs.ref }}
        run: |
          git fetch "$RUNNER_TEMP/release/candidate.bundle" refs/heads/release-candidate
          git checkout --detach "$CANDIDATE_SHA"

      - name: Configura Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instala dependencias
        run: npm ci

      - name: Compila o build de producao
        run: npm run build

  release-tests:
    name: Release helper (local Git)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_artifact && github.sha || inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: inputs.candidate_artifact != ''
        with:
          name: ${{ inputs.candidate_artifact }}
          path: ${{ runner.temp }}/release
      - name: Carrega candidato local validado
        if: inputs.candidate_artifact != ''
        env:
          CANDIDATE_SHA: ${{ inputs.ref }}
        run: |
          git fetch "$RUNNER_TEMP/release/candidate.bundle" refs/heads/release-candidate
          git checkout --detach "$CANDIDATE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts/release -p 'test_*.py' -v
