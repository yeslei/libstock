<main class="auth">
  <div class="auth__shell">
    <!--
      Painel de marca: só existe a partir de 1024px, onde sobra largura. Traz a
      identidade da marca; o ícone ganha uma placa clara porque sua arte é o
      mesmo verde-escuro do painel e desapareceria sobre ele.
    -->
    <aside class="auth__aside">
      <!--
        alt vazio de propósito: o ícone é decorativo aqui, porque o wordmark
        logo abaixo já dá o nome da marca ao leitor de tela.
      -->
      <span class="auth__plate">
        <img
          class="auth__icon"
          src="/assets/logo-libstock-icon.png"
          alt=""
          width="72"
          height="72"
        />
      </span>

      <p class="auth__wordmark">LibStock</p>
      <p class="auth__tagline">Livros &middot; Gestão &middot; Confiança</p>
      <p class="auth__pitch">Acervo, empréstimos, reservas e vendas em um só sistema.</p>
    </aside>

    <section class="auth__card">
      <picture class="auth__brand">
        <!-- Abaixo de 480px o wordmark economiza altura vertical sem perder a marca. -->
        <source media="(max-width: 479px)" srcset="/assets/logo-libstock-wordmark.png" />
        <img
          class="auth__logo"
          src="/assets/logo-libstock-full.png"
          alt="LibStock — Livros, Gestão, Confiança"
          width="180"
          height="180"
        />
      </picture>

      <router-outlet />
    </section>
  </div>
</main>
